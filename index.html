<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a3161"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="USA 2026"/>
  <title>USA 2026</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
  <link rel="stylesheet" href="style.css?v=74"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>

<div id="app">

  <!-- ── Header ── -->
  <header class="app-header">
    <div class="header-top">
      <span class="header-flag">🇺🇸</span>
      <h1 class="header-title">USA 2026</h1>
      <span class="header-sub">Dates TBD</span>
      <button id="editmode-btn" class="editmode-btn" onclick="toggleEditMode()" style="display:none">View</button>
      <button id="auth-btn" class="auth-btn" onclick="handleAuthClick()" style="display:none">Sign in</button>
    </div>
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="timeline">
        <span class="tab-icon">🗽</span> Timeline
      </button>
      <button class="tab-btn" data-tab="notes">
        <span class="tab-icon">📝</span> Notes
      </button>
    </nav>
  </header>

  <!-- ── Main ── -->
  <main class="app-main">

    <div id="view-timeline" class="view active">
      <div class="timeline" id="timeline">
        <p style="color:#7777aa;font-size:14px;padding:40px">Loading trip…</p>
      </div>
    </div>

    <div id="view-notes" class="view">
    </div>

  </main>
</div>

<button id="hard-refresh-btn" title="Clear cache & refresh" onclick="
  navigator.serviceWorker.getRegistrations()
    .then(r => Promise.all(r.map(s => s.unregister())))
    .then(() => caches.keys())
    .then(k => Promise.all(k.map(c => caches.delete(c))))
    .then(() => location.reload(true));
">↺</button>

<!-- City detail overlay (populated by city.js) -->
<div id="city-overlay"></div>

<!-- Generic confirm dialog -->
<div class="loc-modal confirm-modal" id="confirm-modal" style="display:none">
  <div class="loc-modal-box confirm-box">
    <div class="loc-modal-title" id="confirm-title">Are you sure?</div>
    <div class="confirm-message" id="confirm-message"></div>
    <div class="loc-actions">
      <button class="loc-btn loc-btn-secondary" id="confirm-cancel" style="flex:1">Cancel</button>
      <button class="loc-btn loc-btn-primary" id="confirm-ok" style="flex:1">OK</button>
    </div>
  </div>
</div>

<!-- Sign-in screen -->
<div id="auth-screen" class="auth-screen auth-loading" style="display:none">
  <div class="auth-card">
    <div class="auth-flag">🇺🇸</div>
    <h2 class="auth-title">USA 2026</h2>
    <div class="auth-spinner" id="auth-spinner"></div>
    <p class="auth-sub" id="auth-sub">Sign in to continue</p>
    <button class="auth-google-btn" id="auth-google-btn" onclick="signInWithGoogle()">
      <span class="auth-g">G</span> Sign in with Google
    </button>
    <div class="auth-status" id="auth-status"></div>
    <button class="auth-recheck-btn" id="auth-recheck-btn" onclick="refreshApproval()" style="display:none">Check again</button>
    <button class="auth-signout-btn" id="auth-signout-btn" onclick="Store.signOut()" style="display:none">Use a different account</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

<!-- Firebase (compat SDK — exposes global `firebase`) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js?v=1"></script>
<script src="store.js?v=12"></script>

<script src="app.js?v=42"></script>
<script src="city.js?v=71"></script>
<script src="notes.js?v=4"></script>
</body>
</html>
